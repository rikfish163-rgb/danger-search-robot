local_costmap:
  global_frame: world
  robot_base_frame: body
  update_frequency: 8.0
  publish_frequency: 3.0
  transform_tolerance: 0.5
  static_map: false
  rolling_window: true
  # Keep the whole TEB look-ahead inside the rolling window when a frontier
  # lies at the edge of the currently observed free space.  A 6x6 window
  # placed the 3 m look-ahead on the unknown boundary and made valid global
  # plans appear infeasible.
  width: 8.0
  height: 10.0
  resolution: 0.1
  plugins:
  - name: static_layer
    type: costmap_2d::StaticLayer
  - name: inflation_layer
    type: costmap_2d::InflationLayer
  static_layer:
    map_topic: /map_raw
    subscribe_to_updates: false
    track_unknown_space: false
    unknown_cost_value: -1
  inflation_layer:
    inflation_radius: 0.10
    cost_scaling_factor: 12.0
inflation_layer:
  enabled: true
  inflation_radius: 0.10
  cost_scaling_factor: 12.0
