DWAPlannerROS:

  odom_topic: /Odometry

  # A1 第一版导航速度：先求稳
  max_vel_x: 0.40
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

  max_vel_trans: 0.40
  min_vel_trans: 0.0

  max_vel_theta: 1.0
  min_vel_theta: 0.20

  # FAST-LIO Odometry 的 twist 可能不能可靠反映实际速度，
  # 因此这里不能使用过小的动态窗口加速度限制
  acc_lim_x: 5.0
  acc_lim_y: 0.0
  acc_lim_theta: 12.0

  xy_goal_tolerance: 0.30
  yaw_goal_tolerance: 0.35
  latch_xy_goal_tolerance: true

  sim_time: 1.5

  vx_samples: 15
  vy_samples: 1
  vtheta_samples: 30

  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05

  forward_point_distance: 0.325

  stop_time_buffer: 0.2

  scaling_speed: 0.20
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.10

  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.02

  prune_plan: true
